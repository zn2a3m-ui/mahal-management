name: Build Android APK
on:
  push:
    branches: [ main, independent-ledgers-v2 ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore app source
        run: |
          cat app-source/index.html.gz.b64.001 app-source/index.html.gz.b64.002 app-source/index.html.gz.b64.003 | base64 --decode > /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > android/app/src/main/assets/index.html
      - name: Apply app patches
        run: python3 scripts/apply_patches.py
      - name: Improve member name visibility in advances list (visual only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/index.html')
          html = p.read_text(encoding='utf-8')
          marker = '</body>'
          style = r'''
          <style id="advances-name-visibility">
          /* Visual-only adjustment: give member names more room and reduce amount emphasis. */
          .advance-name-visible .it .d { flex: 1 1 68% !important; min-width: 0 !important; font-size: 1.08rem !important; line-height: 1.45 !important; }
          .advance-name-visible .it .d > span { font-size: .92rem !important; line-height: 1.4 !important; }
          .advance-name-visible .it .amt { flex: 0 1 27% !important; max-width: 27% !important; font-size: .88rem !important; white-space: nowrap !important; }
          </style>
          <script>
          (function(){
            function tuneAdvanceRows(){
              document.querySelectorAll('.card,section,details').forEach(function(card){
                var heading=card.querySelector(':scope > b,:scope > h1,:scope > h2,:scope > h3,:scope > summary');
                if(!heading) return;
                var title=(heading.innerText||heading.textContent||'').replace(/\\s+/g,' ').trim();
                if(title.indexOf('السلف')===-1 || title.indexOf('الأعضاء')===-1) return;
                card.classList.add('advance-name-visible');
              });
            }
            tuneAdvanceRows();
            new MutationObserver(tuneAdvanceRows).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          '''
          if 'id="advances-name-visibility"' not in html:
              if marker in html:
                  html = html.replace(marker, style + marker, 1)
              else:
                  html += style
          p.write_text(html, encoding='utf-8')
          PY
      - name: Apply consistent visual polish (CSS only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/index.html')
          html = p.read_text(encoding='utf-8')
          style = r"""
          <style id="app-visual-polish">
          /* A consistent visual refresh only: no markup, data, calculations or handlers are changed. */
          body { font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif !important; line-height: 1.55; }
          .card { border-radius: 16px !important; padding: 15px !important; margin-bottom: 13px !important; box-shadow: 0 3px 14px rgba(20,30,50,.055) !important; }
          body { background: #F3F5F8 !important; color: #14263D !important; }
          .card { background: #FFFFFF !important; border: 1px solid #E5EAF0 !important; }
          .it { background: #FAFBFD !important; }
          input, select, textarea { background: #FFFFFF !important; border: 1px solid #D9E1EA !important; color: #14263D !important; }
          button:not(.sm), .btn { background-color: #159A75 !important; border-color: #159A75 !important; color: #FFFFFF !important; }
          button.sm { background: transparent !important; color: #64748B !important; }
          h1, h2, h3, .title { color: #14263D !important; }

          .it { gap: 10px !important; padding: 11px 9px !important; border-radius: 10px !important; }
          .it + .it { border-top: 1px solid rgba(120,130,150,.13) !important; }
          .d { line-height: 1.5 !important; overflow-wrap: anywhere; }
          .amt { font-variant-numeric: tabular-nums; letter-spacing: .1px; }
          input, select, textarea { border-radius: 11px !important; min-height: 42px; padding: 9px 11px !important; font: inherit !important; }
          input:focus, select:focus, textarea:focus { outline: 2px solid rgba(70,120,190,.22) !important; outline-offset: 1px; }
          button, .btn, .sm { border-radius: 10px !important; font: inherit !important; transition: box-shadow .15s ease, opacity .15s ease; }
          button:active, .btn:active { opacity: .88; }
          h1, h2, h3 { line-height: 1.35 !important; letter-spacing: -.15px; }
          .e { border-radius: 12px !important; padding: 17px 12px !important; }
          </style>
          """
          if 'id="app-visual-polish"' not in html:
              marker = '</body>'
              html = html.replace(marker, style + marker, 1) if marker in html else html + style
              p.write_text(html, encoding='utf-8')
          PY
      - name: Validate app and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('android/app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(scripts) >= 1, f'Missing application script, got {len(scripts)}'
          for section in ('m_cash', 'm_debts', 'm_jam'):
              assert f'id="{section}"' in html, f'Missing account page: {section}'
          assert 'function jcalc()' in html and 'J().monthly=40' in html
          assert 'الإضافة الشهرية للجمعية (40 د.أ إجمالاً)' in html
          assert 'rem=(Number(D.openingBalance)||0)+tot-sp-du' in html, 'Association balance must include monthly additions and subtract purchases and unpaid advances'
          assert 'cashApplied:true' in html and 'label:"دين"' in html
          assert 'تحصيل المشتريات' not in html
          assert 'advances-name-visibility' in html, 'Missing visual-only advances name styling'
          assert 'app-visual-polish' in html, 'Missing visual polish styles'
          manifest = Path('android/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert 'android:icon="@mipmap/ic_launcher"' in manifest
          for icon in ('drawable/ic_launcher_background.xml','drawable/ic_launcher_foreground.xml','drawable/ic_launcher_monochrome.xml','mipmap-anydpi-v26/ic_launcher.xml','mipmap-anydpi/ic_launcher.xml'):
              assert Path('android/app/src/main/res', icon).is_file(), f'Missing launcher icon resource: {icon}'

          Path('/tmp/idarti-app.js').write_text(scripts[0], encoding='utf-8')
          Path('/tmp/advances-style.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/idarti-app.js
          node --check /tmp/advances-style.js
      - name: Decode stable signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/idarti-release.p12"
          test -s "$RUNNER_TEMP/idarti-release.p12"
      - name: Build stable signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/idarti-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease
      - name: Build debug APK (until all stable signing secrets are configured)
        if: env.HAS_RELEASE_KEY != 'true'
        run: gradle -p android assembleDebug
      - name: Verify generated APK
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK"
          sha256sum "$APK"
      - name: Upload stable signed APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idarti-almalia-v2-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK
        if: env.HAS_RELEASE_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idarti-almalia-v2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged stable release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_RELEASE_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
