name: Build Android APK
on:
  push:
    branches: [ main, independent-ledgers-v2 ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore app source
        run: |
          cat app-source/index.html.gz.b64.001 app-source/index.html.gz.b64.002 app-source/index.html.gz.b64.003 | base64 --decode > /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > android/app/src/main/assets/index.html
      - name: Apply app patches
        run: python3 scripts/apply_patches.py
      - name: Improve member name visibility in advances list (visual only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/index.html')
          html = p.read_text(encoding='utf-8')
          marker = '</body>'
          style = r'''
          <style id="advances-name-visibility">
          /* Visual-only adjustment: give member names more room and reduce amount emphasis. */
          .advance-name-visible .it .d,
          .advance-name-visible .it .d > span { font-size: 1.08rem !important; line-height: 1.45 !important; }
          .advance-name-visible .it .amt { font-size: .88rem !important; }
          </style>
          <script>
          (function(){
            function tuneAdvanceRows(){
              document.querySelectorAll('.card,section,details').forEach(function(card){
                var heading=card.querySelector(':scope > b,:scope > h1,:scope > h2,:scope > h3,:scope > summary');
                if(!heading) return;
                var title=(heading.innerText||heading.textContent||'').replace(/\\s+/g,' ').trim();
                if(title.indexOf('السلف')===-1 || title.indexOf('الأعضاء')===-1) return;
                card.classList.add('advance-name-visible');
              });
            }
            tuneAdvanceRows();
            new MutationObserver(tuneAdvanceRows).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          '''
          if 'id="advances-name-visibility"' not in html:
              if marker in html:
                  html = html.replace(marker, style + marker, 1)
              else:
                  html += style
          p.write_text(html, encoding='utf-8')
          PY
      - name: Validate app and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('android/app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(scripts) == 1, f'Expected one application script, got {len(scripts)}'
          for section in ('m_cash', 'm_debts', 'm_jam'):
              assert f'id="{section}"' in html, f'Missing account page: {section}'
          assert 'function jcalc()' in html and 'J().monthly=40' in html
          assert 'الإضافة الشهرية للجمعية (40 د.أ إجمالاً)' in html
          assert 'rem=(Number(D.openingBalance)||0)+tot-sp-du' in html, 'Association balance must include monthly additions and subtract purchases and unpaid advances'
          assert 'cashApplied:true' in html and 'label:"دين"' in html
          assert 'تحصيل المشتريات' not in html
          assert 'advances-name-visibility' in html, 'Missing visual-only advances name styling'
          Path('/tmp/idarti-app.js').write_text(scripts[0], encoding='utf-8')
          Path('/tmp/advances-style.js').write_text(re.search(r'<script>(.*?)</script>', html[html.find('advances-name-visibility'):], re.S).group(1), encoding='utf-8')
          PY
          node --check /tmp/idarti-app.js
      - name: Decode stable signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/idarti-release.p12"
          test -s "$RUNNER_TEMP/idarti-release.p12"
      - name: Build stable signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/idarti-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease
      - name: Build debug APK (until all stable signing secrets are configured)
        if: env.HAS_RELEASE_KEY != 'true'
        run: gradle -p android assembleDebug
      - name: Verify generated APK
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK"
          sha256sum "$APK"
      - name: Upload stable signed APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idarti-almalia-v2-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK
        if: env.HAS_RELEASE_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idarti-almalia-v2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged stable release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_RELEASE_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
